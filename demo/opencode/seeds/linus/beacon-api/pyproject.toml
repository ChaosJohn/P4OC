[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon-api"
version = "0.1.0"
description = "Small incident-status HTTP API for local demos"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
beacon-api = "beacon_api.cli:main"

[tool.setuptools.packages.find]
include = ["beacon_api*"]
